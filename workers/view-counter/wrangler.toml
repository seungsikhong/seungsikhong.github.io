name = "seungsikhong-view-counter"
main = "src/index.js"
compatibility_date = "2026-07-18"

[vars]
ALLOWED_ORIGINS = "https://seungsikhong.github.io,http://localhost:4321,http://127.0.0.1:4321"
VIEW_DEDUPE_SECONDS = "3600"
ALLOWED_POST_PATHS = ""

[[d1_databases]]
binding = "DB"
database_name = "seungsikhong_blog_views"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
